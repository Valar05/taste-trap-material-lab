name: Remove obsolete Pages lane

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep the repository phone-local
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/deploy-pages.yml .github/workflows/remove-pages.yml
          git config user.name "Home Center Fortress"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove obsolete GitHub Pages lane"
          git push
